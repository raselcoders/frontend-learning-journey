<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML Tabble </title>
     <link rel="icon" href="download.png" type="image/x-icon">
    <style>
        body{
            /* background-color: rgb(181, 130, 229); */
            text-align: center;
        }
        table{
            border-collapse: collapse;
            /* margin-left: auto;
            margin-right: auto; */
            margin:auto;
            
        }
        td,th{
            border:1px solid black;
            padding:10px 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Exploing HTML Table</h1>
    </header>
    <main>
        <h2>Friends Name list Table</h2>
        <table>
            <thead>
                <tr>
                    <th>
                        Number
                    </th>
                    <th>
                        Name
                    </th>
                    <th>
                        Last Name
                    </th>
                    <th>
                        Age
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Mike</td>
                    <td>Wheeler</td>
                    <td>22</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Eleven</td>
                    <td>Hopper</td>
                    <td>22</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Dustin</td>
                    <td>Henderson</td>
                    <td>22</td>
                </tr>
            </tbody>
            <tfoot>
                <td colspan="1">Total Friends: 3 </td>
            </tfoot>
        </table>
    </main>

    <footer>

    </footer>
    
</body>
</html>
