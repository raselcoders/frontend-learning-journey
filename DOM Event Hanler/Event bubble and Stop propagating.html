<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubble</title>
    <style>
        body{
            border:2px solid red;
            margin: 2px;
        }
        section{
            border:2px solid blue;
            margin: 2px;
        }
        ol{
            border:2px solid green;
            margin: 2px;
        }
        li{
            border:2px solid blueviolet;
            margin: 2px;
        }
    </style>
</head>
<body id="container">
    <h1>Explore Event Bubble</h1>
    <section id="main-container">
        <h2 >List of Things</h2>
        <ol id="list-tems">
            <li id="items-1">Lorem, ipsum.</li>
            <li id="items-2">Tenetur, at.</li>
            <li id="items-3">Voluptatem, aperiam?</li>
            <li id="items-4">Tempore, quibusdam.</li>
            <li id="items-5">Eos, ad.</li>
            <li id="items-6">Consequatur, nihil.</li>
        </ol>
    </section>


    <script>
        // connect ol>li>2 id= 'items-2'  Propagation off
        document.getElementById('items-2').addEventListener('click',function(event){
            console.log("items-2 connection on");
            event.stopPropagation()
        })

        // connect ol> id= 'list-tems' propagation onn
        document.getElementById('list-tems').addEventListener('click',function(){
            console.log("ol connecting on");
        })

        document.getElementById('main-container').addEventListener('click',function(){
            console.log("Section connecting on");
        })


        document.getElementById('container').addEventListener('click',function(){
            console.log("body connecting on");
        })




    


    </script>
    
</body>
</html>
